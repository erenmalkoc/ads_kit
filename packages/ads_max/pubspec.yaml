name: ads_max
description: >
  AppLovin MAX implementation of the ads_core AdProvider contract. Wraps
  applovin_max — no ads_core-facing API here ever leaks a MAX SDK type.
version: 0.1.0
homepage: https://github.com/erenmalkoc/ads_kit
repository: https://github.com/erenmalkoc/ads_kit/tree/main/packages/ads_max

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ads_core: ^0.1.0
  applovin_max: ^4.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
