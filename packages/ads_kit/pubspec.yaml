name: ads_kit
description: >-
  Mediation-platform-independent ad abstraction: AdProvider contract,
  AdManager, frequency capping, health monitoring and remote-config-driven
  provider selection.
version: 0.1.0
homepage: https://github.com/erenmalkoc/ads_kit
repository: https://github.com/erenmalkoc/ads_kit/tree/main/packages/ads_kit

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  firebase_remote_config: ^6.0.0
  meta: ^1.17.0

dev_dependencies:
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
