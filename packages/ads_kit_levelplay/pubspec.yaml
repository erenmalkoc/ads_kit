name: ads_kit_levelplay
description: >
  Unity LevelPlay (ironSource) implementation of the ads_kit AdProvider
  contract. Wraps unity_levelplay_mediation — no ads_kit-facing API here
  ever leaks a LevelPlay SDK type.
version: 0.1.0
homepage: https://github.com/erenmalkoc/ads_kit
repository: https://github.com/erenmalkoc/ads_kit/tree/main/packages/ads_kit_levelplay

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ads_kit: ^0.1.0
  unity_levelplay_mediation: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
