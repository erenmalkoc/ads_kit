# Workspace root only — the published package named ads_kit lives in
# packages/ads_kit; pub requires unique names inside one workspace.
name: ads_kit_workspace
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - packages/ads_kit
  - packages/ads_kit_levelplay
  - packages/ads_kit_max
  - example

dev_dependencies:
  melos: ^8.0.0

melos:
  command:
    bootstrap:
      usePubspecOverrides: false

  scripts:
    analyze:
      run: melos exec -- dart analyze .
      description: Run static analysis on every package.

    test:
      run: melos exec --dir-exists=test -- flutter test
      description: Run tests on every package that has a test/ directory.

    format:
      run: melos exec -- dart format --set-exit-if-changed .
      description: Check formatting on every package.
