name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a new Flutter stable or transitive release surfaces without a push.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Get dependencies (pub workspace)
        run: flutter pub get

      - name: Activate melos
        # The melos scripts shell out to `melos exec`, so the CLI has to be on PATH.
        run: dart pub global activate melos

      - name: Check formatting
        run: melos run format

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test

      - name: Publish dry-run
        # --no-private selects exactly the three published packages.
        run: melos exec --no-private -- flutter pub publish --dry-run
